<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAIRIES サイト パターン選び</title>
<style>
:root{ --ink:#33302B; --accent:#B98A2F; }
*{ box-sizing:border-box; }
body{ margin:0; font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif; color:var(--ink); background:#FBF7EF; font-size:16px; line-height:1.7; }
.wrap{ max-width:880px; margin:0 auto; padding:22px 14px 60px; }
h1{ font-size:clamp(22px,5.4vw,30px); margin:4px 0 8px; }
.lead{ font-size:clamp(16px,4.4vw,19px); margin:0 0 6px; }
.sub{ font-size:14px; color:#6E675C; margin:0 0 18px; }
.q{ font-size:clamp(18px,5vw,23px); font-weight:700; margin:10px 0 12px; }
.grid{ display:grid; grid-template-columns:1fr; gap:18px; }
@media(min-width:700px){ .grid{ grid-template-columns:1fr 1fr; } }
.pick{ display:block; width:100%; text-align:left; background:#fff; border:2px solid #D8D2C4; border-radius:16px; padding:10px; cursor:pointer; font:inherit; color:inherit; }
.pick:active{ border-color:var(--accent); }
.cap{ font-size:15px; font-weight:700; margin-top:8px; text-align:center; }
.hero{ border-radius:10px; overflow:hidden; aspect-ratio:4/3.1; display:flex; flex-direction:column; }
.hero.big{ aspect-ratio:auto; min-height:340px; }
.hnav{ display:flex; justify-content:space-between; align-items:center; padding:7px 12px; font-size:11px; letter-spacing:.14em; }
.hnav .lg{ font-weight:700; font-size:13px; }
.hbody{ flex:1; display:flex; position:relative; }
.hsplit{ display:flex; width:100%; }
.htxt{ flex:1.05; padding:16px 14px; display:flex; flex-direction:column; justify-content:center; gap:8px; }
.himg{ flex:1; background-size:cover; background-position:center; min-height:120px; }
.hfull{ position:absolute; inset:0; background-size:cover; }
.hband{ position:absolute; left:0; right:0; bottom:0; padding:12px 14px; }
.hprod{ display:flex; flex-direction:column; align-items:center; width:100%; padding:14px 12px 10px; gap:8px; text-align:center; }
.hprod .pimg{ width:82%; height:130px; background-size:cover; background-position:center; border-radius:8px; }
.catch{ font-weight:700; font-size:clamp(15px,2.6vw,19px); line-height:1.5; }
.catchS{ font-weight:700; font-size:14px; line-height:1.5; }
.pname{ font-size:11px; letter-spacing:.2em; opacity:.85; }
.btn{ display:inline-block; padding:8px 18px; border-radius:999px; font-size:13px; font-weight:700; }
.decide{ display:block; width:100%; margin:0 0 18px; padding:16px; font:inherit; font-size:17px; font-weight:700; color:#fff; background:var(--accent); border:none; border-radius:14px; cursor:pointer; }
.back{ margin-top:20px; background:none; border:none; color:var(--accent); font:inherit; font-size:15px; cursor:pointer; text-decoration:underline; }
.result-name{ font-size:clamp(17px,4.6vw,21px); font-weight:700; margin:14px 0 4px; }
#copyBtn{ display:block; width:100%; margin-top:14px; padding:17px; font:inherit; font-size:17px; font-weight:700; color:#fff; background:var(--accent); border:none; border-radius:14px; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h1>FAIRIES サイト パターン選び</h1>

  <p class="sub">これは叩き台です。文字・色・雰囲気・画像は、後からご希望に合わせてすべて変えられます。</p>

</div>

const FAMS = {
  1:{name:"ポスター系", ds:"今のチラシと同じ、ピンクと青の明るい雰囲気", sw:["#F7C8D8","#FFFFFF","#7FB2E5","#C9A227"], light:{bg:"#FDEEF3", band:"#7FB2E5", ink:"#4A2B38", accent:"#B08A1E"}, dark:{bg:"#7A1F3D", band:"#33517A", ink:"#FFF", accent:"#E7CD7E"}},
  2:{name:"ボトル系", ds:"商品ボトルの、白と銀の清潔な雰囲気", sw:["#FFFFFF","#C0C6CE","#EEF1F4"], light:{bg:"#FFFFFF", band:"#98A2AC", ink:"#3D4854", accent:"#78838F"}, dark:{bg:"#39424D", band:"#22282F", ink:"#FFF", accent:"#C0C6CE"}},
  3:{name:"大人シック", ds:"白と黒だけの、大人っぽい雰囲気", sw:["#111111","#FFFFFF","#8C8C8C"], light:{bg:"#FFFFFF", band:"#111111", ink:"#111", accent:"#111"}, dark:{bg:"#111111", band:"#000000", ink:"#FFF", accent:"#FFF"}},
  4:{name:"派手系", ds:"濃いピンクと金で、目立つ雰囲気", sw:["#D6336C","#C9A227","#FFF3E4"], light:{bg:"#FFF3E4", band:"#D6336C", ink:"#5C2140", accent:"#B08A1E"}, dark:{bg:"#8E1440", band:"#5E0D2B", ink:"#FFF", accent:"#E7CD7E"}},
  5:{name:"ナチュラル", ds:"生成りとオリーブの、やさしい雰囲気", sw:["#F5EFE0","#8A9A5B","#D9C7A7"], light:{bg:"#F5EFE0", band:"#8A9A5B", ink:"#4A4436", accent:"#77894A"}, dark:{bg:"#4C5A2E", band:"#333F1F", ink:"#FFF", accent:"#D9C7A7"}}
};
const TONES = { light:"薄い", dark:"濃い" };
const IMGS  = { person:"人物の写真", bottles:"商品の写真" };
const LAYS  = { A:"左右分割", B:"全面写真", C:"商品中心" };

function heroHTML(fam, tone, img, lay, big){
  const c = FAMS[fam][tone];
  const src = img==="person" ? PERSON : BOTTLES;
  const pos = img==="person" ? "70% 18%" : "50% 50%";
  const nav = `<div class="nav" style="color:${c.ink}"><span class="logo">FAIRIES</span><span class="menu">コンセプト　商品紹介　お問い合わせ</span></div>`;
  const txt = `<div class="catch">お肌、本来の力を<br>サポート</div><div class="sub2">潤い続く、ハリ・ツヤのあるお肌へ。<br>MADE IN JAPAN</div><span class="hbtn" style="color:${c.accent};border-color:${c.accent}">詳しく見る</span>`;
  let body="";
  if (lay==="A") body = `<div style="position:absolute;left:0;top:0;width:55%;height:100%;padding:7% 4% 0 6%;color:${c.ink}">${txt}</div><img src="${src}" style="position:absolute;right:0;top:0;width:45%;height:100%;object-fit:cover;object-position:${pos}">`;
  else if (lay==="B") body = `<img src="${src}" style="position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:${pos}"><div style="position:absolute;left:0;bottom:0;width:100%;padding:4% 6%;background:${c.band};color:#FFF"><div class="catch">お肌、本来の力をサポート</div><div class="sub2">潤い続く、ハリ・ツヤのあるお肌へ</div></div>`;
  else body = `<div style="position:absolute;left:0;top:0;width:100%;height:34%;padding-top:4%;text-align:center;color:${c.ink}"><div class="catch">お肌、本来の力をサポート</div><div class="sub2">プレミアムエイジングケアライン</div></div><img src="${src}" style="position:absolute;left:0;bottom:0;width:100%;height:66%;object-fit:cover;object-position:${pos}">`;
  return `<div class="hero${big?" big":""}" style="background:${c.bg}">${nav}<div class="hbody">${body}</div></div>`;
}
function patNo(fam,tone,img,lay){
  return (fam-1)*12 + (tone==="dark"?6:0) + (img==="bottles"?3:0) + ({A:0,B:1,C:2}[lay]) + 1;
}
function patName(fam,tone,img,lay){
  return `No.${patNo(fam,tone,img,lay)} ${FAMS[fam].name}・${TONES[tone]}・${IMGS[img]}・${LAYS[lay]}`;
}

const area = document.getElementById("stepArea");
let base = null; // {fam, tone}
let sel = null;  // {fam, tone, img, lay}

function heroCard(fam, tone, img, lay, onclick){
  return `<button class="pick" onclick="${onclick}">${heroHTML(fam,tone,img,lay,false)}<div class="cap">${FAMS[fam].name}・${TONES[tone]}・${IMGS[img]}・${LAYS[lay]}</div></button>`;
}
function screen1(){
  sel = null; base = null;
  let cards = "";
  [1,2,3,4,5].forEach(f=>{ ["light","dark"].forEach(t=>{
    cards += heroCard(f, t, "bottles", "A", `pickBase(${f},'${t}')`);
  });});
  area.innerHTML = `<div class="q">まず、好きな見た目を一つ押してください</div><div class="grid">${cards}</div>`;
  window.scrollTo(0,0);
}
function pickBase(f, t){ base = {fam:f, tone:t}; screen2(); }
function screen2(){
  const f = base.fam, t = base.tone;
  const variants = [["person","A"],["person","B"],["person","C"],["bottles","B"],["bottles","C"]];
  let cards = variants.map(v=>heroCard(f, t, v[0], v[1], `decide('${v[0]}','${v[1]}')`)).join("");
  area.innerHTML = `<div class="q">同じ雰囲気で、写真と組み立てを変えた見本です</div>`
    + heroHTML(f, t, "bottles", "A", false)
    + `<button class="decide" onclick="decide('bottles','A')">この見本のまま決定する</button>`
    + `<div class="grid">${cards}</div>`
    + `<button class="back" onclick="screen1()">← 最初の見本に戻る</button>`;
  window.scrollTo(0,0);
}
function decide(img, lay){
  sel = { fam: base.fam, tone: base.tone, img: img, lay: lay };
  area.innerHTML = `<div class="q">これに決めました</div>`
    + heroHTML(sel.fam, sel.tone, sel.img, sel.lay, true)
    + `<div class="result-name">${patName(sel.fam, sel.tone, sel.img, sel.lay)}</div>`
    + `<p class="sub">下のボタンを押すと、返信文がコピーされます。そのままLINEやメールに貼って送ってください。ひとこと書き加えたい場合は、文の最後の「追記」の下にお書きください。</p>`
    + `<button id="copyBtn" onclick="doCopy()">返信文をコピーする</button>`
    + `<br><button class="back" onclick="screen1()">最初から選び直す</button>`;
  window.scrollTo(0,0);
}
function doCopy(){
  const name = patName(sel.fam, sel.tone, sel.img, sel.lay);
  const txt = `フェアリーズのサイトのパターンについて\n希望は「${name}」です。\nこの方向性でお願いします。\n――追記――\n（ご希望があれば、この下にお書きください）`;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>alert("コピーしました。LINEやメールに貼って送ってください。"));
  } else { prompt("この文をコピーしてください", txt); }
}
screen1();
