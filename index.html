<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAIRIES サイト パターン見本</title>
<style>
  *{ box-sizing:border-box; }
  body{ font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c",sans-serif; margin:0; background:#faf7f2; color:#333; }
  header{ padding:20px 16px 8px; max-width:960px; margin:0 auto; }
  h1{ font-size:22px; margin:0 0 8px; }
  .lead{ font-size:16px; line-height:1.7; margin:0 0 4px; }
  .sub{ font-size:14px; color:#666; }
  .filters{ position:sticky; top:0; background:#faf7f2; padding:10px 16px; border-bottom:1px solid #e3ddd2; z-index:5; }
  .frow{ max-width:960px; margin:0 auto 8px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .flabel{ font-size:15px; font-weight:bold; width:64px; }
  .fbtn{ font-size:16px; padding:12px 16px; border-radius:999px; border:2px solid #bbb; background:#fff; min-height:52px; cursor:pointer; }
  .fbtn.on{ border-color:#333; background:#333; color:#fff; }
  .count{ max-width:960px; margin:0 auto; font-size:15px; color:#555; }
  main{ max-width:960px; margin:0 auto; padding:16px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; }
  .tile{ background:#fff; border:2px solid #ddd; border-radius:12px; overflow:hidden; cursor:pointer; }
  .tile.sel{ border-color:#C9A227; box-shadow:0 0 0 3px #f3e2ac; }
  .pname{ padding:8px 10px; font-size:14px; display:flex; justify-content:space-between; align-items:center; }
  .badge{ font-size:12px; background:#C9A227; color:#fff; border-radius:999px; padding:2px 8px; display:none; }
  .tile.sel .badge{ display:inline-block; }
  /* --- hero mock --- */
  .hero{ height:190px; position:relative; overflow:hidden; }
  .hero.big{ height:340px; }
  .nav{ position:absolute; left:0; top:0; width:100%; height:11%; min-height:14px; display:flex; align-items:center; justify-content:space-between; padding:0 6%; z-index:3; }
  .logo{ font-weight:bold; letter-spacing:.18em; font-size:10px; }
  .hero.big .logo{ font-size:15px; }
  .menu{ font-size:8px; opacity:.75; letter-spacing:.1em; }
  .hero.big .menu{ font-size:12px; }
  .body{ position:absolute; left:0; top:11%; width:100%; height:89%; }
  .catch{ font-weight:bold; line-height:1.45; font-size:13px; }
  .hero.big .catch{ font-size:24px; }
  .sub2{ font-size:8px; opacity:.85; line-height:1.5; margin-top:4px; }
  .hero.big .sub2{ font-size:14px; }
  .btn{ display:inline-block; margin-top:7px; padding:3px 10px; border-radius:999px; font-size:8px; border:1px solid currentColor; }
  .hero.big .btn{ font-size:13px; padding:6px 16px; }
  .photo{ position:absolute; overflow:hidden; }
  .photo::before{ content:""; position:absolute; left:50%; top:16%; width:34%; aspect-ratio:1; border-radius:50%; transform:translateX(-50%); background:rgba(255,255,255,.55); }
  .photo::after{ content:""; position:absolute; left:50%; bottom:-24%; width:78%; aspect-ratio:1.15; border-radius:50% 50% 0 0; transform:translateX(-50%); background:rgba(255,255,255,.55); }
  .bottles{ position:absolute; left:0; bottom:8%; width:100%; display:flex; justify-content:center; align-items:flex-end; gap:7%; }
  .bottle{ width:11%; position:relative; }
  .bottle .cap{ height:10px; background:linear-gradient(180deg,#e8ecf0,#aeb6bf); border-radius:2px 2px 0 0; margin:0 22%; }
  .bottle .bd{ height:56px; background:linear-gradient(160deg,#ffffff,#d7dde3); border:1px solid #b9c1c9; border-radius:6px 6px 8px 8px; position:relative; }
  .hero.big .bottle .bd{ height:110px; }
  .hero.big .bottle .cap{ height:18px; }
  .bottle .bd::after{ content:"FAIRIES"; position:absolute; left:0; top:38%; width:100%; text-align:center; font-size:5px; letter-spacing:.08em; color:#7b8794; }
  .hero.big .bottle .bd::after{ font-size:9px; }
  .shelf{ position:absolute; left:8%; bottom:5%; width:84%; height:2px; background:rgba(0,0,0,.18); }
  /* lightbox */
  .lb{ position:fixed; inset:0; background:rgba(0,0,0,.72); display:none; z-index:20; padding:18px; overflow:auto; }
  .lb.open{ display:block; }
  .lbcard{ background:#fff; border-radius:14px; max-width:560px; margin:4vh auto; padding:16px; }
  .lbbtns{ display:flex; gap:10px; margin-top:14px; }
  .bigbtn{ flex:1; font-size:17px; padding:14px; border-radius:999px; border:2px solid #333; background:#fff; min-height:56px; cursor:pointer; }
  .bigbtn.primary{ background:#333; color:#fff; }
  footer{ max-width:960px; margin:0 auto; padding:8px 16px 40px; }
  #copyBtn{ width:100%; font-size:17px; padding:16px; border-radius:999px; border:none; background:#C9A227; color:#fff; min-height:60px; cursor:pointer; }
  #selInfo{ font-size:15px; margin-bottom:10px; }
</style>
</head>
<body>
<header>
  <h1>FAIRIES サイト パターン見本</h1>
  <p class="lead">新しいホームページの「顔」の候補です。ご自身のイメージに近いものを選んでください。</p>
  <p class="sub">これは叩き台です。文字・色・雰囲気・画像は、後からご希望に合わせてすべて変えられます。気に入ったものは3つまで選べます。</p>
</header>

<div class="filters">
  <div class="frow" id="fFam"><span class="flabel">系統</span></div>
  <div class="frow" id="fTone"><span class="flabel">濃淡</span></div>
  <div class="frow" id="fLay"><span class="flabel">組立順</span></div>
  <div class="count" id="count"></div>
</div>

<main><div class="grid" id="grid"></div></main>

<footer>
  <div id="selInfo">選んだもの： まだありません</div>
  <button id="copyBtn">選んだ番号をコピーする</button>
  <p class="sub">コピーした文を、そのままLINEやメールでお送りください。</p>
</footer>

<div class="lb" id="lb">
  <div class="lbcard">
    <div id="lbHero"></div>
    <p id="lbName" style="font-size:16px;margin:12px 0 0"></p>
    <div class="lbbtns">
      <button class="bigbtn" id="lbClose">閉じる</button>
      <button class="bigbtn primary" id="lbPick">これにする</button>
    </div>
  </div>
</div>

SiigBB0pVoooAd/DThRRSAVugp46UUUAOHSk70UUCJF6inUUUCY7sKKKKBCjpSGiigCNutJRRQAw9aQUUUFCnpTaKKAP/Z";
function heroHTML(p, big){
  const c = FAMS[p.fam][p.tone];
  const nav = `<div class="nav" style="color:${c.ink}"><span class="logo">FAIRIES</span><span class="menu">コンセプト　商品紹介　お問い合わせ</span></div>`;
  const txt = `<div class="catch">お肌、本来の力を<br>サポート</div><div class="sub2">潤い続く、ハリ・ツヤのあるお肌へ。<br>MADE IN JAPAN</div><span class="btn" style="color:${c.accent};border-color:${c.accent}">詳しく見る</span>`;
  let body = "";
  if (p.lay==="A") body = `<div style="position:absolute;left:0;top:0;width:55%;height:100%;padding:7% 4% 0 6%;color:${c.ink}">${txt}</div><img src="${FACE}" style="position:absolute;right:0;top:0;width:45%;height:100%;object-fit:cover;object-position:top center">`;
  else if (p.lay==="B") body = `<img src="${FACE}" style="position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:top center"><div style="position:absolute;left:0;bottom:0;width:100%;padding:4% 6%;background:${c.band};color:#FFF"><div class="catch">お肌、本来の力をサポート</div><div class="sub2">潤い続く、ハリ・ツヤのあるお肌へ</div></div>`;
  else body = `<div style="position:absolute;left:0;top:0;width:100%;height:34%;padding-top:4%;text-align:center;color:${c.ink}"><div class="catch">お肌、本来の力をサポート</div><div class="sub2">プレミアムエイジングケアライン</div></div><img src="${BOTTLES}" style="position:absolute;left:0;bottom:0;width:100%;height:66%;object-fit:cover;object-position:center 30%">`;
  return `<div class="hero${big?" big":""}" style="background:${c.bg}">${nav}<div class="body">${body}</div></div>`;
}
const state = { fam:0, tone:"all", lay:"all", sel:[], cur:null };
function mkBtn(label, on, fn){ const b=document.createElement("button"); b.className="fbtn"+(on?" on":""); b.textContent=label; b.onclick=fn; return b; }
function renderFilters(){
  const ff=document.getElementById("fFam"); ff.querySelectorAll("button").forEach(b=>b.remove());
  ff.appendChild(mkBtn("すべて", state.fam===0, ()=>{state.fam=0; sync();}));
  for (const f of [1,2,3,4,5]) ff.appendChild(mkBtn(FAMS[f].name, state.fam===f, ()=>{state.fam=f; sync();}));
  const ft=document.getElementById("fTone"); ft.querySelectorAll("button").forEach(b=>b.remove());
  ft.appendChild(mkBtn("両方", state.tone==="all", ()=>{state.tone="all"; sync();}));
  ft.appendChild(mkBtn("薄い", state.tone==="light", ()=>{state.tone="light"; sync();}));
  ft.appendChild(mkBtn("濃い", state.tone==="dark", ()=>{state.tone="dark"; sync();}));
  const fl=document.getElementById("fLay"); fl.querySelectorAll("button").forEach(b=>b.remove());
  fl.appendChild(mkBtn("すべて", state.lay==="all", ()=>{state.lay="all"; sync();}));
  for (const l of ["A","B","C"]) fl.appendChild(mkBtn(LAYS[l], state.lay===l, ()=>{state.lay=l; sync();}));
}
function renderGrid(){
  const g=document.getElementById("grid"); g.innerHTML="";
  const list = patterns.filter(p => (state.fam===0||p.fam===state.fam) && (state.tone==="all"||p.tone===state.tone));
  if (state.lay!=="all") list.sort((a,b)=> (b.lay===state.lay) - (a.lay===state.lay));
  document.getElementById("count").textContent = `表示中： ${list.length}件`;
  for (const p of list){
    const d=document.createElement("div"); d.className="tile"+(state.sel.includes(p.no)?" sel":"");
    d.innerHTML=`${heroHTML(p,false)}<div class="pname"><span>${p.name}</span><span class="badge">選択中</span></div>`;
    d.onclick=()=>{ state.cur=p; document.getElementById("lbHero").innerHTML=heroHTML(p,true); document.getElementById("lbName").textContent=p.name; document.getElementById("lbPick").textContent = state.sel.includes(p.no)?"選択を取り消す":"これにする"; document.getElementById("lb").classList.add("open"); };
    g.appendChild(d);
  }
  const si=document.getElementById("selInfo");
  si.textContent = state.sel.length ? `選んだもの： ${state.sel.map(x=>"No."+x).join("、")}` : "選んだもの： まだありません";
}
function sync(){ renderFilters(); renderGrid(); }
document.getElementById("lbClose").onclick=()=>document.getElementById("lb").classList.remove("open");
document.getElementById("lbPick").onclick=()=>{
  const no=state.cur.no;
  if (state.sel.includes(no)) state.sel=state.sel.filter(x=>x!==no);
  else { if (state.sel.length>=3){ alert("選べるのは3つまでです。"); return; } state.sel.push(no); }
  document.getElementById("lb").classList.remove("open"); renderGrid();
};
document.getElementById("copyBtn").onclick=async()=>{
  if (!state.sel.length){ alert("まだ選ばれていません。"); return; }
  const txt = `FAIRIES パターンの希望です： ${state.sel.map(x=>"No."+x).join("、")}`;
  try{ await navigator.clipboard.writeText(txt); alert("コピーしました。そのままLINEやメールに貼って送ってください。"); }
  catch(e){ prompt("この文をコピーしてください", txt); }
};
sync();
</script>
